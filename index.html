<script>
window.onload=function(){
	console.log("加载中")
function callFun(e) {
    console.log("vue call fun" + JSON.stringify(e.data));
    // SecondPage 2   FirstPage 1
    if (e.data.event == 'SecondPage') {
	iframePage = true
    }else if(e.data.event == 'FirstPage'){
	iframePage = false
    }
    if (e.data.event != 'CustomEvent') return;
    postData(ApiUrl.khjd + "/app", { id: e.data.additionalData.baseId },
	function (data) {
	    console.log("个人数据====》" + JSON.stringify(data));
	    if (data) {
		goToQjSt(data)
	    }
	})
}
window.addEventListener('message', callFun);
// 创建dom
var newParagraph = document.createElement("iframe");
newParagraph.id = 'mapFrame'
newParagraph.src = "https://www.baidu.com"
newParagraph.width="100%"
newParagraph.height="500px"
var appDiv = document.getElementById("app");
appDiv.appendChild(newParagraph);
console.log("加载结束")
}

</script>
