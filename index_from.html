<!DOCTYPE html>

<html lang="zh-cn">

<head>

<meta charset="utf-8">

<title>iframe</title>

<meta name="viewport" content="width=device-width">

<meta name="description" content="A collection of loading spinners animated with CSS">

<meta property="og:title" content="Single Element CSS Spinners">

<meta property="og:type" content="website">

<meta property="og:description" content="A collection of loading spinners animated with CSS">


<script>

 function callFun(){
     console.log("dj");
	 let info=0
	 try{
		info= location.href.split("?")[1].split("=")[1]
	 }catch(e){
		 
	 }
    var CustomEvent = {
	data:info?info:0
    };  
    window.parent.postMessage(CustomEvent, '*');
 }
callFun()
console.log("加载结束")
</script>
<style type="text/css">

.animate-continer {
	background: rgb(50, 50, 50);
	opacity: 0.4;
	overflow: hidden;
}
 
 
.animate {
	position: relative;
}
 
 
.animate>div:first-of-type,
.animate>div:nth-child(2),
.animate>div:nth-child(3),
.animate>div:last-of-type {
	position: absolute;
	width: 5px;
	height: 5px;
	border-radius: 100%;
	top:450px;
	margin: 2px;
}
 
 
.animate>div:first-of-type {
	left:-15px;
	background: rgb(255, 255, 255);
	animation: loader 3s  200ms infinite;
    -webkit-animation: loader 3s  200ms infinite; /* Safari 与 Chrome */
}
 
 
.animate>div:nth-child(2) {
	left:-30px;
	background: rgb(255, 255, 255);
	animation: loader 3s  400ms infinite;
    -webkit-animation: loader 3s  400ms infinite; /* Safari 与 Chrome */
}
 
 
.animate>div:nth-child(3) {
	left:-45px;
	background: rgb(255, 255, 255);
	animation: loader 3s  600ms infinite;
    -webkit-animation: loader 3s  600ms infinite; /* Safari 与 Chrome */
}
 
 
.animate>div:last-of-type {
	left:-60px;
	background: rgb(255, 255, 255);
	animation: loader 3s  800ms infinite;
    -webkit-animation: loader 3s  800ms infinite; /* Safari 与 Chrome */
}
 
 
.back {
    width: 100%;
    height: 900px;
    border-radius: 10px;
    margin: 0;
    top: 0;
    position: absolute;
    left: 0;
}
 
 
@keyframes loader {
	0% { width:5px; height:5px; transform: translate(0, 0);}
	45% { width:10px; height:10px; transform: translate(187px, 0); }
	55% { width:10px; height:10px; transform: translate(187px, 0); }
	100% { width:5px; height:5px; transform: translate(375px, 0); }
}
 
 
@-webkit-keyframes loader
{
    0% { width:5px; height:5px; transform: translate(0, 0);}
	45% { width:10px; height:10px; transform: translate(187px, 0); }
	55% { width:10px; height:10px; transform: translate(187px, 0); }
	100% { width:5px; height:5px; transform: translate(375px, 0); }
}

</style>

</head>

<body>

<div class="animate-continer back">
	<div class="animate">
		<div></div>
		<div></div>
		<div></div>
		<div></div>
	</div>
</div>

</body>

</html>
